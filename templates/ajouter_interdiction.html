{% extends "base.html" %}

{% block title %}Ajouter interdiction{% endblock %}
{% block toptitle %}Ajouter une interdiction{% endblock %}

{% block content %}

<h2>Ajouter une interdiction</h2>

{% if message %}
<div class="alert alert-error">{{ message }}</div>
{% endif %}

<form method="POST" style="max-width:500px;">
    <div class="form-group">
        <label>UE 1</label>
        <select name="ue1" required>
            <option value="">-- Selectionner --</option>
            {% for ue in ues %}
            <option value="{{ ue.id }}">{{ ue.code }} - {{ ue.nom }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>UE 2</label>
        <select name="ue2" required>
            <option value="">-- Selectionner --</option>
            {% for ue in ues %}
            <option value="{{ ue.id }}">{{ ue.code }} - {{ ue.nom }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>Raison (optionnel)</label>
        <input type="text" name="raison" placeholder="Raison de l'interdiction">
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="/interdictions" class="btn">Annuler</a>
</form>

{% endblock %}
